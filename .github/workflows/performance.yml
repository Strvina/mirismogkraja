name: performance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'database/seeders/LoadTest*/**'
      - 'database/seeders/LoadTestSeeder.php'
      - 'scripts/perf/**'
      - '.github/workflows/performance.yml'

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: vrelina_perf_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: vrelina_perf_ci
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, exif, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and build
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate
          npm run build
      - name: Seed an isolated database
        run: |
          php artisan migrate --force
          php artisan db:seed --class=LoadTestSeeder
      - name: Measure before and after the indexes
        run: |
          mkdir -p storage/perf
          php scripts/perf/indexes.php down
          php scripts/perf/measure.php --runs=10 --cold=1 --out=storage/perf/mysql-before.json
          php scripts/perf/measure.php --only="Admin/products, page 1" --queries --explain=3 > storage/perf/mysql-plans-before.txt
          php scripts/perf/indexes.php up
          php scripts/perf/measure.php --runs=10 --cold=1 --out=storage/perf/mysql-after.json
          php scripts/perf/measure.php --only="Admin/products, page 1" --queries --explain=3 > storage/perf/mysql-plans-after.txt
          php scripts/perf/report.php storage/perf/mysql-before.json storage/perf/mysql-after.json > storage/perf/mysql-report.md
          cat storage/perf/mysql-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-performance
          path: storage/perf/
