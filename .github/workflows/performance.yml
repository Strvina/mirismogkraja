name: performance

# Times the main pages on MySQL 8 with and without the two index migrations.
# It compares, it does not judge: no number here can fail a pull request, so
# it runs when the measuring itself changes, or by hand - not on every
# migration.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'database/seeders/LoadTest*/**'
      - 'database/seeders/LoadTestSeeder.php'
      - 'scripts/perf/**'
      - '.github/workflows/performance.yml'

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: vrelina_perf_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: vrelina_perf_ci
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, exif, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and build
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate
          npm run build
      - name: Seed, then measure before and after the indexes
        env:
          PERF_RUNS: 10
          PERF_COLD: 1
        run: |
          sh scripts/perf/run.sh
          cat storage/perf/mysql-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-performance
          path: storage/perf/
