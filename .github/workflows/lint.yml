name: linter

on:
  push:
    branches:
      - master
      - improve/integration
  # Every pull request, whatever its base: work is reviewed on integration
  # branches before it reaches master.
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # Checks only: a style problem fails the run instead of being fixed
      # on the runner and thrown away.
      - name: Pint
        run: vendor/bin/pint --test

      # A misspelled class, method or variable on a path no test walks.
      - name: PHPStan
        run: |
          cp .env.example .env
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npx eslint .

      - name: TypeScript
        run: npx tsc --noEmit
