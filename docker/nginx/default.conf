# nginx of the local Docker stack (docs/docker.md). It follows
# deploy/nginx.conf, the one for a real server; what differs is the port,
# the missing domain, that PHP is another container, reached over TCP, and
# the room given to PHP's response headers.

server {
    # Not 80: the image runs nginx as an ordinary user, which may not open
    # a port below 1024.
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # Uploads up to the app's own limit (4 MB per photo, several at once).
    client_max_body_size 32M;

    # Compress what is text. nginx compresses only HTML unless told the
    # types, so without this the main script travels at three times its
    # size - and every page change is a JSON response.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # Docker's own DNS, asked again every few seconds. Given the name
    # directly, nginx looks "app" up once, when it starts - and after a
    # rebuild has replaced the PHP container, keeps sending requests to an
    # address that nobody has any more.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php app:9000;

    # Built assets have the content hash in their name: cached for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded photos and their small copies get new names when replaced.
    # They are in the storage volume, which this container only reads.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        # Room for the response headers. Laravel names every script and
        # style of a page in a Link header, for the browser to fetch early;
        # with the cookies and the security policy the home page sends
        # about 5 KB of headers. nginx sets aside 4 KB by default, and
        # answers 502 ("upstream sent too big header") to anything larger.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;

        fastcgi_pass $php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Nothing outside public/ is served, and no dotfiles inside it.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
