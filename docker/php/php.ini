; On top of PHP's own php.ini-production (see the Dockerfile).

; The application takes photos of up to 4 MB, several in one form. nginx
; allows the same 32 MB (docker/nginx/default.conf).
upload_max_filesize = 8M
post_max_size = 32M

expose_php = Off

; The code never changes inside a running container, so a compiled script is
; never checked against its file again.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
