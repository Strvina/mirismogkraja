# nginx for Vrelina juga. Copy to /etc/nginx/sites-available/vrelina-juga,
# replace example.rs and the path, link it into sites-enabled, then let
# certbot add HTTPS:  sudo certbot --nginx -d example.rs -d www.example.rs

server {
    listen 80;
    listen [::]:80;
    server_name example.rs www.example.rs;

    root /var/www/vrelina-juga/public;
    index index.php;

    charset utf-8;
    # Uploads up to the app's own limit (4 MB per photo, several at once).
    client_max_body_size 32M;

    # Built assets have the content hash in their name: cached for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded photos and their small copies get new names when replaced.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Nothing outside public/ is served, and no dotfiles inside it.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
